name: fantasy-football-ai

services:
  backend:
    image: fantasy-football-ai-backend:gpu
    build:
      context: ./backend
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu134
    init: true
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      FANTASY_CACHE_PATH: /app/cache/runtime.sqlite3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - projection-cache:/app/cache
      - type: bind
        source: ./backend/models/pytorch
        target: /app/models/pytorch
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ENABLE_LOCAL_LEAGUE: "true"
    restart: unless-stopped
    network_mode: service:backend
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  projection-cache:
