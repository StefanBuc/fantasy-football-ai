map $uri $fantasy_cache_control {
    default "no-cache";
    ~^/api/ "no-store, private";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Tunnel terminates HTTPS. Authentication is enforced by the API,
    # independent of forwarded client IP/proto headers. Never cache API sessions.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $fantasy_cache_control always;

    location /api/ {
        # Session and CSRF checks also apply to the legacy /local/ paths.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
